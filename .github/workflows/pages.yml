name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "tools/build_guide.py"
      - "tools/build_pages.py"
      - "test/**"
      - "README.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "tools/build_guide.py"
      - "tools/build_pages.py"
      - "test/**"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the documentation builder
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r test/pages-requirements.txt
      - name: Build and validate the public site
        run: |
          .venv/bin/python tools/build_pages.py
          .venv/bin/python test/check_pages.py
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

stages:
  - build
  - deploy

validate_pages:
  stage: build
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "lab"'
    - if: '$CI_COMMIT_BRANCH == "lab" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  script:
    - python -m venv .venv
    - .venv/bin/pip install -r test/pages-requirements.txt
    - .venv/bin/python tools/build_pages.py
    - .venv/bin/python test/check_pages.py
  artifacts:
    paths:
      - artifacts/pages/

pages:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: validate_pages
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "lab" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  script:
    - mkdir -p public
    - cp -a artifacts/pages/. public/
  artifacts:
    paths:
      - public/

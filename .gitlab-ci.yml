stages:
  - build
  - deploy

validate_pages:
  stage: build
  image: python:3.12-slim
  script:
    - python -m venv .venv
    - .venv/bin/pip install -r test/pages-requirements.txt
    - .venv/bin/python tools/build_pages.py
    - .venv/bin/python test/check_pages.py
  artifacts:
    paths:
      - artifacts/pages/

pages:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: validate_pages
      artifacts: true
  script:
    - mkdir -p public
    - cp -a artifacts/pages/. public/
  artifacts:
    paths:
      - public/
  only:
    - main

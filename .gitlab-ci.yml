stages:
  - build
  - deploy
  - package
  - release

validate_pages:
  stage: build
  image: python:3.12-slim
  script:
    - python -m venv .venv
    - .venv/bin/pip install -r test/pages-requirements.txt
    - .venv/bin/python tools/build_pages.py
    - .venv/bin/python test/check_pages.py
  artifacts:
    paths:
      - artifacts/pages/

pages:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: validate_pages
      artifacts: true
  script:
    - mkdir -p public
    - cp -a artifacts/pages/. public/
  artifacts:
    paths:
      - public/
  only:
    - main

package_release:
  stage: package
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - python -m unittest test.test_package_release
    - python tools/package_release.py --tag "$CI_COMMIT_TAG" --output-dir artifacts/release
  artifacts:
    paths:
      - artifacts/release/
    reports:
      dotenv: artifacts/release/release.env
    expire_in: 1 year

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package_release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - test -f "$ARCHIVE_PATH"
    - test -f "$CHECKSUM_PATH"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Num-Layout $CI_COMMIT_TAG"
    description: "$CI_COMMIT_TAG_MESSAGE"
    assets:
      links:
        - name: "$ARCHIVE_FILE"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/$ARCHIVE_PATH?job=package_release"
        - name: "$CHECKSUM_FILE"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/$CHECKSUM_PATH?job=package_release"
